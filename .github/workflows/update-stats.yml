name: Update stats

on:
  schedule:
    - cron: '0 19 * * 0'   # 逢星期一 03:00 香港時間（UTC 週日 19:00）
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pull fresh numbers from Apify
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/update_stats.py

      - name: Commit stats.json if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "actions@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || git commit -m "chore: weekly stats refresh"
          git push
